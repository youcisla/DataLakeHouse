# ============================================================
#  Spark default configuration : projet DataLake Météo
#  Copié dans le conteneur Spark (SPARK_HOME/conf/spark-defaults.conf)
# ============================================================

# Master par défaut (standalone)
spark.master=spark://spark-master:7077

# ---------- Compression : Parquet + Zstd niveau 22 ----------
spark.sql.parquet.compression.codec=zstd
spark.sql.parquet.compression.codec.zstd.level=22
spark.io.compression.codec=zstd
spark.io.compression.codec.zstd.level=22

# ---------- Idempotence : overwrite dynamique des partitions ----------
spark.sql.parquet.partitionOverwriteMode=dynamic

# ---------- Mémoire & exécution ----------
spark.driver.memory=2g
spark.executor.memory=2g
spark.executor.cores=2
spark.sql.shuffle.partitions=8

# ---------- Divers ----------
spark.sql.session.timeZone=UTC
spark.sql.adaptive.enabled=true
spark.ui.port=4040
